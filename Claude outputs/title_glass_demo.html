<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Glass title preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:28px;background:#eef2f6;
 font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.caption{max-width:1180px;margin:0 auto 14px;font-size:12.5px;color:#6b7f94}
.frame{max-width:1180px;margin:0 auto 22px;background:#fff;border:1px solid #e3eaf2;
 border-radius:10px;overflow:hidden}
.navbar{background:linear-gradient(135deg,#2c3e50,#34495e);height:56px}
.wb-header{display:flex;align-items:center;justify-content:space-between;gap:32px;
 padding:13px 28px;background:#fff;border-bottom:1px solid #e3eaf2}
.wb-header-left{position:relative;display:flex;align-items:center;gap:14px}
.wb-header-left::after{content:"";position:absolute;left:45%;top:50%;width:220px;height:34px;
 transform:translateY(-50%);border-radius:999px;
 background:radial-gradient(closest-side,rgba(79,164,166,.22),transparent 70%);
 filter:blur(10px);pointer-events:none;z-index:-1}
.wb-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
 letter-spacing:.09em;text-transform:uppercase;color:#8296ab}
.wb-header-divider{width:1px;height:20px;background:#e0e7ef}
.wb-title{position:relative;margin:0;padding:7px 20px;border-radius:999px;
 font-size:19px;font-weight:700;letter-spacing:-.005em;color:#1a4472;white-space:nowrap;
 background:linear-gradient(140deg,rgba(255,255,255,.78) 0%,rgba(233,242,250,.42) 45%,rgba(206,228,238,.52) 100%);
 border:1px solid rgba(255,255,255,.85);
 -webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%);
 box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(43,89,142,.06) inset,
  0 0 0 1px rgba(43,89,142,.10),0 6px 16px rgba(31,66,104,.13);
 text-shadow:0 1px 0 rgba(255,255,255,.6)}
.wb-title::before{content:"";position:absolute;left:6px;right:6px;top:1px;height:45%;
 border-radius:999px 999px 40% 40% / 999px 999px 100% 100%;
 background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));
 pointer-events:none}
.stepper{display:flex;align-items:center;gap:0;list-style:none;margin:0;padding:0}
.st{display:flex;align-items:center;gap:8px}
.dot{width:23px;height:23px;border-radius:50%;display:inline-flex;align-items:center;
 justify-content:center;font-size:11.5px;font-weight:700;background:#eef2f7;color:#9aabbd;
 border:1px solid #e3e9f0}
.nm{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:#9aabbd}
.ln{width:22px;height:1px;background:#e0e7ef;margin:0 9px}
.st.cur .dot{background:#2b598e;border-color:#2b598e;color:#fff}
.st.cur .nm{color:#24466d}
.st.done .dot{background:#e3eef7;border-color:#cfe0ee;color:#3f7fa0}
.st.done .nm{color:#6d8ba3}
.body{height:120px;background:#f9fbfd;border-top:0}
</style></head><body>
<p class="caption">玻璃质感标题胶囊 &mdash; 半透明淡蓝面板 + 顶部高光 + 背后一层青绿色辉光。</p>
<div class="frame">
  <div class="navbar"></div>
  <div class="wb-header">
    <div class="wb-header-left">
      <span class="wb-eyebrow">STEP 2 OF 6</span>
      <span class="wb-header-divider"></span>
      <h1 class="wb-title">Feature Annotation</h1>
    </div>
    <ol class="stepper">
      <li class="st done"><span class="dot">1</span><span class="nm">Upload</span></li>
      <li class="ln"></li>
      <li class="st cur"><span class="dot">2</span><span class="nm">Annotate</span></li>
      <li class="ln"></li>
      <li class="st"><span class="dot">3</span><span class="nm">Network</span></li>
      <li class="ln"></li>
      <li class="st"><span class="dot">4</span><span class="nm">Modules</span></li>
      <li class="ln"></li>
      <li class="st"><span class="dot">5</span><span class="nm">Function</span></li>
      <li class="ln"></li>
      <li class="st"><span class="dot">6</span><span class="nm">Results</span></li>
    </ol>
  </div>
  <div class="body"></div>
</div>
</body></html>
